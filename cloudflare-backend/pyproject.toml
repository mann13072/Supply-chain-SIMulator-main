[project]
name = "solarchain-cloudflare-backend"
version = "0.1.0"
description = "Cloudflare deployment copy of the Supply Chain Simulator backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic[email]>=2.7.0",
    "sqlalchemy>=2.0.0",
    "python-jose>=3.3.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.6",
]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]

[tool.uv]
package = false
